#
# The setup (just first time):
# docker-compose run bp sh -c 'yarn && yarn compile'
#
# You can use whatever script you want from package.json, just replace the command, for example:
# - To get blueprint docs: `docker-compose run bp sh -c 'yarn dev:docs'`
#
version: '3'
services:
  docs:
    image: node:12
    command: sh -c 'yarn && yarn dev'
    working_dir: /hostdata
    volumes:
      - .:/hostdata
      - ${DEVELOPMENT_DIR}/config/npmrc:/root/.npmrc
    #   - ${DEVELOPMENT_DIR}/repositories/graphext/node_modules/@blueprintjs:/root/graphext/blueprintjs
    ports:
      - "9999:9000"
