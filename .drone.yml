---
kind: pipeline
name: blueprint
trigger:
  branch:
  - deploy
steps:
- name: build
  image: node:18-alpine3.18
  commands:
  - apk add --update-cache bash
  - echo -n $NPMRC | base64 -d > /root/.npmrc
  - yarn
  - yarn compile
  - yarn dist:libs
  - rm /root/.npmrc
  environment:
    NPMRC:
     from_secret: NPMRC
- name: publish
  image: node:18-alpine3.18
  depends_on:
  - build
  commands:
  - echo -n $NPMRC | base64 -d > /root/.npmrc
  - npm publish packages/core
  - npm publish packages/icons
  - npm publish packages/datetime
  - npm publish packages/table
  - npm publish packages/select
  - npm publish packages/datetime2
  - rm /root/.npmrc
  environment:
    NPMRC:
     from_secret: NPMRC
- name: docs
  image: node:18-alpine3.18
  depends_on:
  - build
  commands:
  - yarn dist:apps
  - yarn site:clean
  - yarn copy:docs-app
  - mkdir /root/.ssh && echo "$DEPLOY_KEY" > /root/.ssh/id_rsa && chmod 0600 /root/.ssh/id_rsa
  - ssh-keyscan github.com >> /root/.ssh/known_hosts
  - git config user.email "drone@graphext.com"
  - git config user.name "drone"
  - git remote set-url origin git@github.com:graphext/blueprint.git
  - yarn deploy
  environment:
    DEPLOY_KEY:
     from_secret: deploy-key
---
kind: signature
hmac: 10e26b5e8f3138a0c5b172984657314b3b2f05cb28f689864534e05401846889

