labels:
  hostname: secondary-rwo

when:
  - event: push
    branch: deploy
  - event: pull_request

variables:
  - &node_image node:20-alpine
  - &default_backend_options
    backend_options:
      kubernetes:
        resources:
          requests:
            memory: 8Gi
            cpu: 2000m
            ephemeral-storage: 10Gi
          limits:
            memory: 12Gi
            cpu: 4000m
            ephemeral-storage: 10Gi

steps:
  - name: build
    image: *node_image
    commands:
      - apk add --update-cache bash
      - corepack enable
      - echo -n $NPMRC | base64 -d > /root/.npmrc
      - yarn
      - yarn compile
      - yarn dist
      - rm /root/.npmrc
    environment:
      NPMRC:
        from_secret: NPMRC_GAR_CI
    <<: *default_backend_options

  - name: publish
    when:
      event: push
      branch: deploy
    image: *node_image
    commands:
      - apk add --update-cache git openssh
      - echo -n $NPMRC | base64 -d > /root/.npmrc
      - node scripts/resolveWorkspaceRefs.js
      - |
        published=0
        failed=0
        for pkg in icons core select datetime datetime2 table; do
          if out=$(npm publish ./packages/$pkg 2>&1); then
            echo "$out"
            published=$((published + 1))
          else
            echo "$out"
            if echo "$out" | grep -q "already exists"; then
              echo ">>> skip $pkg (version already published)"
            else
              failed=$((failed + 1))
            fi
          fi
        done
        if [ "$failed" -gt 0 ]; then
          echo "ERROR: $failed package(s) failed to publish"
          exit 1
        fi
        if [ "$published" -eq 0 ]; then
          echo "ERROR: nothing was published"
          exit 1
        fi
        echo "Published $published package(s)"
      - rm /root/.npmrc
    environment:
      NPMRC:
        from_secret: NPMRC_GAR_CI_PRIVATE
    depends_on:
      - build
    <<: *default_backend_options

  - name: publish-preview
    when:
      event: pull_request
    image: *node_image
    commands:
      - apk add --update-cache git openssh
      - echo -n $NPMRC | base64 -d > /root/.npmrc
      - SHA=$(echo $CI_COMMIT_SHA | cut -c1-7)
      - PR_TAG="pr-${CI_COMMIT_PULL_REQUEST}"
      - |
        for pkg in icons core select datetime datetime2 table; do
          node -e "
            const fs = require('fs');
            const p = './packages/$pkg/package.json';
            const j = JSON.parse(fs.readFileSync(p));
            j.version = j.version + '-preview.${SHA}';
            fs.writeFileSync(p, JSON.stringify(j, null, 4) + '\n');
          "
        done
      - node scripts/resolveWorkspaceRefs.js
      - |
        published=0
        failed=0
        for pkg in icons core select datetime datetime2 table; do
          if out=$(npm publish ./packages/$pkg --tag $PR_TAG 2>&1); then
            echo "$out"
            published=$((published + 1))
          else
            echo "$out"
            if echo "$out" | grep -q "already exists"; then
              echo ">>> skip $pkg (version already published)"
            else
              failed=$((failed + 1))
            fi
          fi
        done
        if [ "$failed" -gt 0 ]; then
          echo "ERROR: $failed package(s) failed to publish"
          exit 1
        fi
        if [ "$published" -eq 0 ]; then
          echo "ERROR: nothing was published"
          exit 1
        fi
        echo "Published $published package(s) under dist-tag '$PR_TAG'"
        echo "To consume: npm install @blueprintjs/<pkg>@$PR_TAG"
      - rm /root/.npmrc
    environment:
      NPMRC:
        from_secret: NPMRC_GAR_CI_PRIVATE
    depends_on:
      - build
    <<: *default_backend_options

  - name: docs
    when:
      event: push
      branch: deploy
    image: *node_image
    commands:
      - apk add --update-cache git openssh
      - corepack enable
      - yarn site:clean
      - yarn copy:docs-app
      - mkdir /root/.ssh && echo "$DEPLOY_KEY" > /root/.ssh/id_rsa && chmod 0600 /root/.ssh/id_rsa
      - ssh-keyscan github.com >> /root/.ssh/known_hosts
      - git config user.email "woodpecker@graphext.com"
      - git config user.name "Woodpecker CI"
      - git remote set-url origin git@github.com:graphext/blueprint.git
      - yarn deploy
    environment:
      DEPLOY_KEY:
        from_secret: DEPLOY_KEY
    depends_on:
      - build
    <<: *default_backend_options
